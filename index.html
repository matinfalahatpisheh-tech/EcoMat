    <script>
      (function () {
        var OrigWS = window.WebSocket;
        if (!OrigWS) return;
        function ViteHmrSocketShim(url, protocols) {
          var isVite =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (Array.isArray(protocols) &&
              (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1));
          if (!isVite) {
            return protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
          }
          var target = new EventTarget();
          target.url = String(url || '');
          target.readyState = 1;
          target.OPEN = 1;
          target.CONNECTING = 0;
          target.CLOSING = 2;
          target.CLOSED = 3;
          target.send = function () {};
          target.close = function () {
            target.readyState = 3;
          };
          setTimeout(function () {
            target.dispatchEvent(new Event('open'));
          }, 0);
          return target;
        }
        ViteHmrSocketShim.prototype = OrigWS.prototype;
        ViteHmrSocketShim.CONNECTING = 0;
        ViteHmrSocketShim.OPEN = 1;
        ViteHmrSocketShim.CLOSING = 2;
        ViteHmrSocketShim.CLOSED = 3;
        window.WebSocket = ViteHmrSocketShim;
      })();
    </script>
  </head>
